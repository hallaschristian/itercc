name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # The compiled core is built on first use with the runner's g++ (OpenMP).
      ITERCC_KERNEL_CACHE: ${{ github.workspace }}/.kernel-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Build the core with CMake
        run: |
          cmake -S core -B core/build
          cmake --build core/build -j 4
      - name: Test
        run: python -m pytest -q
      - name: Examples
        run: |
          python examples/minimal.py
          python examples/ccsdtq.py
